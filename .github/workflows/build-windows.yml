name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview pyinstaller

      - name: Smoke-test the app
        run: |
          python -c "import backend.app; print('import ok')"

      - name: Fetch PDF.js (vendored at runtime, not in git)
        run: |
          mkdir -p static/vendor
          curl -L -o static/vendor/pdf.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js
          curl -L -o static/vendor/pdf.worker.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js

      - name: Build EXE with PyInstaller
        run: pyinstaller OpenReader.spec --noconfirm

      - name: Upload EXE bundle
        uses: actions/upload-artifact@v4
        with:
          name: OpenReader-windows
          path: dist/OpenReader/

      - name: Zip the bundle
        run: Compress-Archive -Path dist/OpenReader -DestinationPath OpenReader-windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OpenReader v1.0 (build ${{ github.run_number }})
          files: OpenReader-windows.zip
