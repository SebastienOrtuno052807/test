<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 14px; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: #171a21; color: #e8eaf0; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  .page { background: #1e222c; border: 1px solid #2e3542; border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
  .page .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page .u { color: #9aa3b5; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  label { display: block; font-size: 12px; color: #9aa3b5; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; background: #1e222c; border: 1px solid #2e3542; color: #e8eaf0; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  button { width: 100%; margin-top: 12px; background: #4d8fd1; color: #fff; border: 0; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { background: #6cb2ff; }
  button:disabled { opacity: .55; cursor: default; }
  #status { margin-top: 10px; font-size: 13px; min-height: 20px; }
  #status.ok { color: #b2f2bb; } #status.err { color: #fcc2d7; }
  .hint { font-size: 11.5px; color: #9aa3b5; margin-top: 10px; }
</style>
</head>
<body>
  <h3>📖 Save to OpenReader</h3>
  <div class="page">
    <div class="t" id="page-title">…</div>
    <div class="u" id="page-url">…</div>
  </div>
  <button id="save">Save this page</button>
  <label for="server">OpenReader server URL</label>
  <input id="server" type="url" spellcheck="false">
  <div id="status"></div>
  <div class="hint">Tip: right-click any link or page → “Save to OpenReader”. If your server link changes, paste the new URL above.</div>
  <script src="popup.js"></script>
</body>
</html>
